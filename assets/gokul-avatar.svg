<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2F3A4D"/>
      <stop offset="100%" stop-color="#0C111C"/>
    </radialGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="24" fill="url(#bgGlow)"/>
  <rect x="2" y="2" width="396" height="396" rx="22" stroke="rgba(245, 241, 232, 0.1)" stroke-width="2"/>

  <!-- Editorial Grid Lines & Watermark -->
  <path d="M40 0v400 M360 0v400 M0 40h400 M0 360h400" stroke="rgba(245, 241, 232, 0.04)" stroke-width="1"/>
  <circle cx="200" cy="165" r="115" stroke="rgba(245, 158, 11, 0.12)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Minimalist Executive Portrait Silhouette -->
  <!-- Head & Hair -->
  <path d="M155 130 C155 85, 245 85, 245 130 C245 168, 225 188, 200 188 C175 188, 155 168, 155 130 Z" fill="#1D2534" stroke="#F59E0B" stroke-width="2"/>
  <!-- Hair Styling -->
  <path d="M152 125 C150 90, 190 70, 245 78 C252 85, 250 110, 245 118 C235 95, 185 88, 152 125 Z" fill="#F59E0B" opacity="0.85"/>
  <!-- Glasses / Modern Executive Frame -->
  <rect x="168" y="128" width="24" height="14" rx="3" stroke="#F5F1E8" stroke-width="2" fill="none"/>
  <rect x="208" y="128" width="24" height="14" rx="3" stroke="#F5F1E8" stroke-width="2" fill="none"/>
  <path d="M192 135 h16" stroke="#F5F1E8" stroke-width="2"/>

  <!-- Shoulders & Blazer -->
  <path d="M105 320 C110 240, 155 220, 200 220 C245 220, 290 240, 295 320 Z" fill="#1D2534" stroke="rgba(245, 241, 232, 0.2)" stroke-width="2"/>
  <!-- Collar & Tie/Shirt -->
  <path d="M185 220 L200 260 L215 220" stroke="#F59E0B" stroke-width="2" fill="none"/>
  <path d="M200 260 L194 320 M200 260 L206 320" stroke="rgba(245, 241, 232, 0.2)" stroke-width="1.5"/>

  <!-- Corner Crop Marks -->
  <path d="M20 32 h12 M32 20 v12" stroke="#F59E0B" stroke-width="2"/>
  <path d="M380 32 h-12 M368 20 v12" stroke="#F59E0B" stroke-width="2"/>
  <path d="M20 368 h12 M32 380 v-12" stroke="#F59E0B" stroke-width="2"/>
  <path d="M380 368 h-12 M368 380 v-12" stroke="#F59E0B" stroke-width="2"/>

  <!-- Monogram & Label -->
  <rect x="150" y="342" width="100" height="24" rx="6" fill="#0C111C" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1"/>
  <text x="200" y="358" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#F59E0B" text-anchor="middle" letter-spacing="2">GOKUL T V</text>
</svg>
